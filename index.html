<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LLM API Price Tracker</title>
<meta name="description" content="Output price per 1M tokens for 11 LLM providers, Jan 2025 to Nov 2026, tracked tier by tier: Opus against Opus, Sonnet against Sonnet, Flash against Flash.">
<style>
  @font-face { font-family: 'Geist Mono'; src: url('fonts/GeistMono-Regular.ttf') format('truetype'); font-weight: 400; font-style: normal; }
  @font-face { font-family: 'Geist Mono'; src: url('fonts/GeistMono-SemiBold.ttf') format('truetype'); font-weight: 500 700; font-style: normal; }

  :root {
    --bg: #F4EFE6;
    --card: #FBF8F1;
    --ink: #1B1A17;
    --muted: #7A7468;
    --faint: #A39C8E;
    --rule: #E2DACA;
    --up: #B5472A;      /* price went up: terracotta */
    --down: #1D8A6A;    /* price went down: green */
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    padding: 40px 32px 56px; max-width: 1180px; margin: 0 auto;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }

  /* ---------- header ---------- */
  .eyebrow { font-size: 11px; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: 10px; }
  h1 { font-size: 26px; line-height: 1.25; font-weight: 600; letter-spacing: -0.02em; max-width: 42ch; }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 28px; }
  .stat { border-top: 2px solid var(--ink); padding-top: 12px; }
  .stat .num { font-size: 34px; font-weight: 600; letter-spacing: -0.03em; line-height: 1.1; }
  .stat .num small { font-size: 15px; font-weight: 400; color: var(--muted); letter-spacing: 0; }
  .stat .cap { font-size: 11.5px; color: var(--muted); line-height: 1.6; margin-top: 6px; max-width: 38ch; }

  /* ---------- sections ---------- */
  section { margin-top: 56px; }
  h2 { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
  .key { display: flex; flex-wrap: wrap; gap: 6px 20px; margin-top: 14px; font-size: 11.5px; color: var(--muted); }
  .key span { display: inline-flex; align-items: center; gap: 6px; }
  .sw { width: 14px; height: 3px; display: inline-block; }
  .sw.dash { background: none !important; border-top: 3px dashed var(--ink); height: 0; }
  .ring, .disc { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .ring { border: 2px solid var(--ink); background: var(--card); }
  .ring.dash { border-style: dashed; }
  .disc { background: var(--ink); }

  /* ---------- scoreboard (dumbbell) ---------- */
  .board { margin-top: 18px; background: var(--card); border: 1px solid var(--rule); border-radius: 10px; padding: 8px 24px 20px; }
  .axis { display: grid; grid-template-columns: 200px 1fr 96px; column-gap: 20px; height: 30px; align-items: end; }
  .axis .ticks { position: relative; height: 100%; }
  .axis .t { position: absolute; bottom: 4px; transform: translateX(-50%); font-size: 10.5px; color: var(--faint); }
  .gh { font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); padding: 16px 0 6px; border-top: 1px solid var(--ink); margin-top: 8px; font-weight: 600; }
  .row { display: grid; grid-template-columns: 200px 1fr 96px; column-gap: 20px; align-items: center; border-top: 1px solid var(--rule); min-height: 50px; }
  .row .who { padding: 6px 0; }
  .row .who b { font-size: 13px; font-weight: 600; display: block; }
  .row .who span { font-size: 10.5px; color: var(--muted); display: block; line-height: 1.5; margin-top: 2px; }
  .track { position: relative; height: 50px; }
  .grid-v { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--rule); opacity: 0.7; }
  .bar { position: absolute; top: 25px; height: 3px; transform: translateY(-50%); border-radius: 2px; }
  .pt { position: absolute; top: 25px; width: 11px; height: 11px; border-radius: 50%; transform: translate(-50%, -50%); border: 2px solid var(--ink); background: var(--card); }
  .pt.dash { border-style: dashed; }
  .pt.now { background: var(--ink); }
  .lab { position: absolute; font-size: 11px; transform: translateX(-50%); white-space: nowrap; }
  .lab.a { top: 3px; color: var(--muted); }
  .lab.b { top: 33px; font-weight: 600; }
  .lab.only { top: 3px; font-weight: 600; color: var(--ink); }
  .delta { text-align: right; font-size: 13px; font-weight: 600; }
  .delta small { display: block; font-size: 10.5px; font-weight: 400; color: var(--muted); margin-top: 1px; }
  .up { color: var(--up); } .dn { color: var(--down); } .flat { color: var(--muted); }

  /* ---------- small multiples ---------- */
  .panels { margin-top: 18px; display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
  .panel { background: var(--card); border: 1px solid var(--rule); border-radius: 10px; padding: 14px 14px 12px; display: flex; flex-direction: column; }
  .panel h3 { font-size: 13px; font-weight: 600; }
  .panel svg { width: 100%; height: auto; display: block; margin-top: 8px; overflow: visible; }
  .lgs { margin-top: 8px; border-top: 1px solid var(--rule); padding-top: 8px; display: grid; gap: 5px; }
  .lg { display: grid; grid-template-columns: 14px 1fr; column-gap: 8px; align-items: baseline; font-size: 11px; line-height: 1.5; color: var(--muted); }
  .lg i { width: 14px; height: 3px; display: block; transform: translateY(-3px); }
  .lg b { color: var(--ink); font-weight: 600; }
  svg text { font-family: 'Geist Mono', ui-monospace, monospace; }
  .halo { paint-order: stroke; stroke: var(--card); stroke-width: 3.5px; stroke-linejoin: round; }

  /* ---------- biggest moves ---------- */
  .moves { margin-top: 18px; background: var(--card); border: 1px solid var(--rule); border-radius: 10px; padding: 8px 24px 16px; }
  .mrow { display: grid; grid-template-columns: 230px 1fr 140px; column-gap: 20px; align-items: center; border-top: 1px solid var(--rule); min-height: 44px; }
  .mrow:first-child { border-top: none; }
  .mrow .what { font-size: 12px; line-height: 1.45; padding: 6px 0; }
  .mrow .what b { font-weight: 600; }
  .mrow .what span { display: block; font-size: 10.5px; color: var(--muted); }
  .mtrack { position: relative; height: 40px; }
  .mzero { position: absolute; left: 50%; top: 4px; bottom: 4px; width: 1px; background: var(--ink); opacity: 0.5; }
  .mbar { position: absolute; top: 50%; height: 14px; transform: translateY(-50%); border-radius: 2px; }
  .mval { font-size: 12.5px; font-weight: 600; text-align: right; }
  .mval small { display: block; font-size: 10.5px; font-weight: 400; color: var(--muted); }
  .mscale { display: grid; grid-template-columns: 230px 1fr 140px; column-gap: 20px; font-size: 10.5px; color: var(--faint); padding-top: 8px; border-top: 1px solid var(--rule); }
  .mscale div:nth-child(2) { position: relative; height: 14px; }
  .mscale .s { position: absolute; transform: translateX(-50%); }

  /* ---------- footer ---------- */
  .notes { margin-top: 48px; font-size: 11.5px; line-height: 1.85; color: var(--muted); max-width: 100ch; }
  .credit { margin-top: 28px; font-size: 11px; color: var(--faint); }
  .credit a { color: var(--muted); text-decoration: none; border-bottom: 1px solid var(--rule); }
  .credit a:hover { color: var(--down); }

  /* ---------- tooltip ---------- */
  #tip { position: fixed; z-index: 10; pointer-events: none; background: var(--ink); color: #FBF8F1; font-size: 11.5px; line-height: 1.6; padding: 8px 11px; border-radius: 6px; opacity: 0; transition: opacity .08s; max-width: 260px; }
  #tip b { font-weight: 600; }
  #tip .u { color: #F2A58C; } #tip .d { color: #7FD6B6; }

  @media (max-width: 760px) {
    body { padding: 28px 16px 40px; }
    body { font-size: 14px; }
    .key { font-size: 12.5px; }
    .stat .cap { font-size: 13px; }
    h2 { font-size: 17px; }
    .axis .t { font-size: 11.5px; }
    .axis .t.minor { display: none; }
    .lab { font-size: 12.5px; }
    .gh { font-size: 11.5px; }
    .row .who b { font-size: 14.5px; }
    .row .who span { font-size: 12px; }
    .delta { font-size: 14.5px; }
    .delta small { font-size: 11.5px; }
    .panel { padding: 16px 12px 14px; }
    .panel h3 { font-size: 15px; }
    .lg { font-size: 12.5px; }
    .mrow .what { font-size: 13.5px; }
    .mrow .what span { font-size: 12px; }
    .mval { font-size: 14px; }
    .mval small { font-size: 11.5px; }
    .mscale { font-size: 11.5px; }
    .notes { font-size: 12.5px; }
    .credit { font-size: 12px; }
    #tip { font-size: 13px; }

    h1 { font-size: 22px; }
    .stats { grid-template-columns: 1fr; gap: 20px; }
    .board, .moves { padding: 4px 14px 14px; }
    .axis, .row { grid-template-columns: 1fr 88px; }
    .axis > :first-child { display: none; }
    .axis .ticks { grid-column: 1; }
    .row .who { grid-column: 1 / -1; padding-bottom: 0; }
    .row { min-height: 0; row-gap: 0; }
    .track { grid-column: 1; }
    .delta { grid-column: 2; }
    .mrow, .mscale { grid-template-columns: 1fr 90px; }
    .mrow .what { grid-column: 1 / -1; padding-bottom: 0; }
    .mscale > :first-child { display: none; }
  }
</style>
</head>

/* ------------------------------------------------------------------
   Derived numbers. Everything on the page is computed from L.
   ------------------------------------------------------------------ */
const fmtMoney = v => '$' + (Math.abs(v - Math.round(v)) < 1e-9 ? String(Math.round(v)) : v.toFixed(2));
const long = i => { const [mo, yy] = MONTHS[i].split(' '); return mo + ' 20' + yy; };
const pct = r => r >= 2 ? r.toFixed(r >= 10 ? 0 : 1) + 'x' : (r > 1 ? '+' : '−') + Math.round(Math.abs(r - 1) * 100) + '%';
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');

L.forEach(l => {
  l.s = l.d.findIndex(v => v !== null);
  l.e = l.d.length - 1 - [...l.d].reverse().findIndex(v => v !== null);
  l.a = l.d[l.s]; l.b = l.d[l.e];
  l.ratio = l.b / l.a;
  l.n = l.e - l.s + 1;
  l.board = !l.hist && l.n >= MIN_MONTHS;
  const names = Object.entries(l.m).sort((x, y) => x[0] - y[0]).map(x => x[1]);
  l.firstModel = names[0]; l.lastModel = names[names.length - 1];
  l.events = [];
  for (let i = l.s + 1; i <= l.e; i++) {
    if (l.d[i] !== l.d[i - 1]) l.events.push({ l, i, from: l.d[i - 1], to: l.d[i], r: l.d[i] / l.d[i - 1], model: l.m[i] || '' });
  }
});
const tiers = L.filter(l => l.board);
// headline numbers use only prices confirmed from a dated source
const sure = tiers.filter(l => !l.u[l.s] && !l.u[l.e]);
const events = L.filter(l => !l.hist).flatMap(l => l.events).filter(e => !e.l.u[e.i] && !e.l.u[e.i - 1]);
const upEvents = events.filter(e => e.r > 1).length;
const higher = sure.filter(l => l.ratio > 1).length;
const rise = [...sure].sort((x, y) => y.ratio - x.ratio)[0];
const cut = [...sure].sort((x, y) => x.ratio - y.ratio)[0];

document.getElementById('stats').innerHTML = `
  <div class="stat"><div class="num">${higher} <small>of ${sure.length}</small></div><div class="cap">tiers end Nov 2026 above their first charted price</div></div>
  <div class="stat"><div class="num">${upEvents} <small>of ${events.length}</small></div><div class="cap">repricings were increases; ${events.length - upEvents} were cuts</div></div>
  <div class="stat"><div class="num">${pct(rise.ratio)} <small>/ ${pct(cut.ratio)}</small></div><div class="cap">largest rise (${rise.prov} ${rise.tier}) and largest cut (${cut.prov} ${cut.tier}) within one tier</div></div>`;

/* ---------- tooltip ---------- */
const tip = document.getElementById('tip');
function showTip(html, ev) {
  tip.innerHTML = html; tip.style.opacity = 1;
  const pad = 14, w = tip.offsetWidth, h = tip.offsetHeight;
  let x = ev.clientX + pad, y = ev.clientY + pad;
  if (x + w > innerWidth - 8) x = ev.clientX - w - pad;
  if (y + h > innerHeight - 8) y = ev.clientY - h - pad;
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
}
const hideTip = () => { tip.style.opacity = 0; };
function evTip(e) {
  const cls = e.r > 1 ? 'u' : 'd', arrow = e.r > 1 ? '↑' : '↓';
  return `<b>${e.l.prov} ${esc(e.l.tier)}</b> &middot; ${long(e.i)}<br>${esc(e.model || 'repricing')}<br>${fmtMoney(e.from)} &rarr; <b>${fmtMoney(e.to)}</b> <span class="${cls}">${arrow} ${pct(e.r)}</span>`;
}

const anyDashStart = tiers.some(l => l.u[l.s]);
const anyDashSeg = L.some(l => l.u.some(Boolean));

/* ------------------------------------------------------------------
   1. Scoreboard (first month vs Nov 2026), grouped by provider
   ------------------------------------------------------------------ */
(function () {
  const LO = 0.1, HI = 100, lx = v => (Math.log(v) - Math.log(LO)) / (Math.log(HI) - Math.log(LO)) * 100;
  const ticks = [0.1, 0.3, 1, 3, 10, 30, 100];
  const grid = ticks.map(t => `<i class="grid-v" style="left:${lx(t)}%"></i>`).join('');
  document.getElementById('boardKey').innerHTML =
    `<span><i class="ring"></i> first charted price</span>` +
    (anyDashStart ? `<span><i class="ring dash"></i> first price unconfirmed</span>` : '') +
    `<span><i class="disc"></i> Nov 2026 price</span>` +
    `<span><i class="sw" style="background:var(--up)"></i> ended higher</span>` +
    `<span><i class="sw" style="background:var(--down)"></i> ended lower</span>`;
  let html = `<div class="axis"><div></div><div class="ticks">${ticks.map(t => `<span class="t${/^[3]/.test(String(t)) ? ' minor' : ''}" style="left:${lx(t)}%">$${t}</span>`).join('')}</div><div></div></div>`;
  let prov = null;
  tiers.forEach(l => {
    if (l.prov !== prov) { prov = l.prov; html += `<div class="gh">${prov}</div>`; }
    const flat = l.ratio === 1, up = l.ratio > 1, col = flat ? 'var(--faint)' : up ? 'var(--up)' : 'var(--down)';
    const lo = lx(Math.min(l.a, l.b)), hi = lx(Math.max(l.a, l.b));
    const delta = flat ? 'no change' : (up ? (l.ratio >= 2 ? l.ratio.toFixed(l.ratio >= 10 ? 0 : 1) + 'x' : '+' + Math.round((l.ratio - 1) * 100) + '%') : '−' + Math.round((1 - l.ratio) * 100) + '%');
    const span = l.firstModel === l.lastModel ? esc(l.firstModel) : `${esc(l.firstModel)} \u2192 ${esc(l.lastModel)}`;
    const when = (l.s > 0 ? 'from ' + MONTHS[l.s] : '') + (l.s > 0 && l.e < LAST ? ' ' : '') + (l.e < LAST ? 'to ' + MONTHS[l.e] : '');
    html += `<div class="row">
      <div class="who"><b>${esc(l.tier)}</b><span>${span}${when ? ' &middot; ' + when : ''}</span></div>
      <div class="track">${grid}
        ${flat ? '' : `<i class="bar" style="left:${lo}%;width:${hi - lo}%;background:${col}"></i><i class="pt${l.u[l.s] ? ' dash' : ''}" style="left:${lx(l.a)}%"></i>`}<i class="pt now" style="left:${lx(l.b)}%"></i>
        ${flat ? `<span class="lab only" style="left:${lx(l.b)}%">${fmtMoney(l.b)}</span>` : `<span class="lab a" style="left:${lx(l.a)}%">${fmtMoney(l.a)}</span><span class="lab b" style="left:${lx(l.b)}%">${fmtMoney(l.b)}</span>`}
      </div>
      <div class="delta ${flat ? 'flat' : up ? 'up' : 'dn'}">${flat ? '' : up ? '↑ ' : '↓ '}${delta}<small>${flat ? fmtMoney(l.a) : fmtMoney(l.a) + ' &rarr; ' + fmtMoney(l.b)}</small></div>
    </div>`;
  });
  document.getElementById('board').innerHTML = html;
})();

/* ------------------------------------------------------------------
   2. Small multiples, one panel per provider group
   ------------------------------------------------------------------ */
(function () {
  const W = 340, H = 214, ml = 36, mr = 46, mt = 14, mb = 22;
  const pw = W - ml - mr, ph = H - mt - mb;
  const LO = 0.1, HI = 100;
  const X = i => ml + (i / LAST) * pw;
  const Y = v => mt + (1 - (Math.log(v) - Math.log(LO)) / (Math.log(HI) - Math.log(LO))) * ph;
  const COLORS = ['#1B1A17', '#3F7893', '#B8862B', '#8C8577', '#5C8A4A'];

  document.getElementById('panelKey').innerHTML =
    `<span><i class="sw" style="background:var(--up)"></i> price rose</span>` +
    `<span><i class="sw" style="background:var(--down)"></i> price fell</span>` +
    (anyDashSeg ? `<span><i class="sw dash"></i> price unconfirmed</span>` : '');

  const yTicks = [0.1, 1, 10, 100], xTicks = [0, 6, 12, 18];
  const yLab = t => '$' + t;
  const frame = yTicks.map(t => `<line x1="${ml}" x2="${ml + pw}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--rule)" stroke-width="1"/><text x="${ml - 6}" y="${Y(t) + 3.5}" text-anchor="end" font-size="10.5" fill="var(--faint)">${yLab(t)}</text>`).join('')
    + xTicks.map(i => `<line x1="${X(i)}" x2="${X(i)}" y1="${mt}" y2="${mt + ph}" stroke="var(--rule)" stroke-width="1" stroke-dasharray="2 3"/>` + (i % 12 === 0 ? `<text x="${X(i)}" y="${H - 6}" text-anchor="start" font-size="10.5" fill="var(--faint)">Jan ’${25 + i / 12}</text>` : '')).join('')
    + `<text x="${X(LAST)}" y="${H - 6}" text-anchor="end" font-size="10.5" fill="var(--faint)">Nov ’26</text>`;

  const groups = [];
  L.forEach(l => { let g = groups.find(x => x.title === l.grp); if (!g) groups.push(g = { title: l.grp, lines: [] }); g.lines.push(l); });

  let html = '';
  groups.forEach((g, gi) => {
    const placed = [];
    const hit = b => placed.some(o => b.x < o.x + o.w && b.x + b.w > o.x && b.y < o.y + o.h && b.y + b.h > o.y);
    // obstacles: every flat run and riser of every line in the panel
    const runs = g.lines.map(l => {
      const out = []; let i0 = l.s;
      for (let i = l.s + 1; i <= l.e + 1; i++) {
        if (i === l.e + 1 || l.d[i] !== l.d[i0] || l.u[i] !== l.u[i0]) { out.push({ i0, i1: Math.min(i, l.e), v: l.d[i0], u: l.u[i0] }); i0 = i; }
      }
      return out;
    });
    runs.forEach(rs => rs.forEach(r => { if (r.i1 > r.i0) placed.push({ x: X(r.i0), y: Y(r.v) - 2, w: X(r.i1) - X(r.i0), h: 4 }); }));
    g.lines.forEach(l => l.events.forEach(e => { const y0 = Math.min(Y(e.from), Y(e.to)); placed.push({ x: X(e.i) - 2, y: y0, w: 4, h: Math.abs(Y(e.from) - Y(e.to)) }); }));

    // right-edge price labels, nudged apart so they never overlap
    const ends = g.lines.filter(l => l.e === LAST).map(l => ({ l, y: Y(l.b) + 4 })).sort((p, q) => p.y - q.y);
    for (let k = 1; k < ends.length; k++) if (ends[k].y - ends[k - 1].y < 13) ends[k].y = ends[k - 1].y + 13;
    ends.forEach(o => placed.push({ x: X(LAST) + 4, y: o.y - 11, w: 44, h: 14 }));

    const place = (x, y, text, up) => {
      const w = text.length * 6.7 + 2, h = 12;
      const spots = up
        ? [[x + 6, y - 7, 'start'], [x - 6, y - 7, 'end'], [x + 6, y + 14, 'start'], [x - 6, y + 14, 'end']]
        : [[x + 6, y + 14, 'start'], [x - 6, y + 14, 'end'], [x + 6, y - 7, 'start'], [x - 6, y - 7, 'end']];
      for (const [tx, ty, anchor] of spots) {
        const b = { x: anchor === 'start' ? tx : tx - w, y: ty - 9, w, h };
        if (b.x < ml - 4 || b.x + b.w > W - 2 || b.y < 0 || b.y + b.h > mt + ph + 4 || hit(b)) continue;
        placed.push(b);
        return [tx, ty, anchor];
      }
      return null;
    };

    let paths = '', marks = '', labels = '';
    g.lines.forEach((l, k) => {
      const col = COLORS[k % COLORS.length];
      // flat runs, dashed where the price is unconfirmed
      runs[k].forEach(r => {
        if (r.i1 <= r.i0) return;
        paths += `<path d="M${X(r.i0).toFixed(1)} ${Y(r.v).toFixed(1)} L${X(r.i1).toFixed(1)} ${Y(r.v).toFixed(1)}" fill="none" stroke="${col}" stroke-width="2.2"${r.u ? ' stroke-dasharray="4 3"' : ''}/>`;
      });
      // risers + dots at every repricing
      l.events.forEach(e => {
        const c = e.r > 1 ? 'var(--up)' : 'var(--down)', x = X(e.i);
        paths += `<line x1="${x}" x2="${x}" y1="${Y(e.from)}" y2="${Y(e.to)}" stroke="${c}" stroke-width="2.6"/>`;
      });
      marks += `<circle cx="${X(l.s)}" cy="${Y(l.a)}" r="3.6" fill="var(--card)" stroke="${col}" stroke-width="2"/>`;
      if (l.e < LAST) marks += `<circle cx="${X(l.e)}" cy="${Y(l.b)}" r="3.2" fill="${col}"/>`;
    });

    // start labels first, then the biggest moves, then labels for tiers that ended early
    g.lines.forEach((l, k) => {
      const col = COLORS[k % COLORS.length];
      const pos = place(X(l.s), Y(l.a), fmtMoney(l.a), !(l.events[0] && l.events[0].r > 1));
      if (pos) labels += `<text class="halo" x="${pos[0]}" y="${pos[1]}" text-anchor="${pos[2]}" font-size="11" fill="${col}">${fmtMoney(l.a)}</text>`;
    });
    const big = g.lines.flatMap(l => l.events.filter(e => e.i < LAST - 1 && Math.abs(Math.log(e.r)) >= Math.log(2)))
      .sort((x, y) => Math.abs(Math.log(y.r)) - Math.abs(Math.log(x.r)));
    big.forEach(e => {
      const pos = place(X(e.i), Y(e.to), fmtMoney(e.to), e.r > 1);
      if (pos) labels += `<text class="halo" x="${pos[0]}" y="${pos[1]}" text-anchor="${pos[2]}" font-size="11" font-weight="600" fill="${e.r > 1 ? 'var(--up)' : 'var(--down)'}">${fmtMoney(e.to)}</text>`;
    });
    g.lines.forEach((l, k) => {
      if (l.e === LAST) return;
      const pos = place(X(l.e), Y(l.b), fmtMoney(l.b), true);
      if (pos) labels += `<text class="halo" x="${pos[0]}" y="${pos[1]}" text-anchor="${pos[2]}" font-size="11" font-weight="600" fill="${COLORS[k % COLORS.length]}">${fmtMoney(l.b)}</text>`;
    });

    const dots = g.lines.map((l, k) => l.events.map((e, ei) => {
      const c = e.r > 1 ? 'var(--up)' : 'var(--down)', x = X(e.i), y = Y(e.to);
      return `<circle cx="${x}" cy="${y}" r="3.6" fill="${c}"/><circle class="hit" data-g="${gi}" data-l="${k}" data-e="${ei}" cx="${x}" cy="${y}" r="10" fill="transparent" style="cursor:pointer"/>`;
    }).join('')).join('');

    const endLabels = ends.map(o => `<text class="halo" x="${X(LAST) + 8}" y="${o.y}" font-size="13" font-weight="600" fill="${COLORS[g.lines.indexOf(o.l) % COLORS.length]}">${fmtMoney(o.l.b)}</text>`).join('');

    const legend = g.lines.map((l, k) => {
      const span = l.firstModel === l.lastModel ? l.firstModel : `${l.firstModel} → ${l.lastModel}`;
      const ended = l.e < LAST ? ` · to ${MONTHS[l.e]}` : '';
      const named = l.firstModel.toLowerCase().includes(l.tier.toLowerCase());
      return `<div class="lg"><i style="background:${COLORS[k % COLORS.length]}"></i><div>${named ? `<b>${esc(span)}</b>` : `<b>${esc(l.tier)}</b> ${esc(span)}`}${ended}</div></div>`;
    }).join('');

    g.svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(g.title)} output price by tier">${frame}${paths}${marks}${labels}${dots}${endLabels}</svg>`;
    html += `<div class="panel"><h3>${esc(g.title)}</h3>${g.svg}<div class="lgs">${legend}</div></div>`;
  });

  const root = document.getElementById('panels');
  root.innerHTML = html;
  const evOf = h => groups[h.dataset.g].lines[h.dataset.l].events[h.dataset.e];
  root.addEventListener('pointerover', ev => { const h = ev.target.closest('.hit'); if (h) showTip(evTip(evOf(h)), ev); });
  root.addEventListener('pointermove', ev => { if (ev.target.closest('.hit')) showTip(tip.innerHTML, ev); });
  root.addEventListener('pointerout', ev => { if (ev.target.closest('.hit')) hideTip(); });
})();

/* ------------------------------------------------------------------
   3. Largest repricings (diverging, log ratio)
   ------------------------------------------------------------------ */
(function () {
  const top = [...events].sort((a, b) => Math.abs(Math.log(b.r)) - Math.abs(Math.log(a.r))).slice(0, 10);
  const span = 1.5; // log10 half-range: 0.03x to 32x
  const pos = r => Math.log10(r) / span * 50;
  let html = '';
  top.forEach(e => {
    const up = e.r > 1, w = Math.abs(pos(e.r));
    html += `<div class="mrow">
      <div class="what"><b>${esc(e.model)}</b><span>${e.l.prov} ${esc(e.l.tier)} &middot; ${long(e.i)}</span></div>
      <div class="mtrack"><i class="mzero"></i><i class="mbar" style="background:${up ? 'var(--up)' : 'var(--down)'};${up ? `left:50%;width:${w}%` : `right:50%;width:${w}%`}"></i></div>
      <div class="mval ${up ? 'up' : 'dn'}">${up ? '↑' : '↓'} ${pct(e.r)}<small>${fmtMoney(e.from)} &rarr; ${fmtMoney(e.to)}</small></div>
    </div>`;
  });
  const marks = [0.1, 1, 10].map(r => `<span class="s" style="left:${50 + pos(r)}%">${r === 1 ? 'no change' : (r < 1 ? '−90%' : r + 'x')}</span>`).join('');
  html += `<div class="mscale"><div></div><div>${marks}</div><div></div></div>`;
  document.getElementById('moves').innerHTML = html;
})();
</script>
</body>
